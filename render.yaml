services:
  - type: web
    name: coursepulse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        fromDatabase:
          name: coursepulse-db
          property: connectionString

databases:
  - name: coursepulse-db
    plan: free
    databaseName: coursepulse
