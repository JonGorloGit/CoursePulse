<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missing Person Report · 4471-B</title><style>body{margin:0;background:#e9ebec;color:#1c2126;font:16px system-ui,sans-serif}.wrap{max-width:500px;margin:auto;padding:14px 10px 40px}.sheet{background:#fff;border:1px solid #cfd4d8}.head,.box{padding:14px}.head{border-bottom:2px solid #34495a}.meta{font:12px ui-monospace,monospace;color:#6b737a}.section{background:#dde2e5;padding:7px 14px;font-size:13px;font-weight:700;color:#34495a}label{display:block;font-weight:600;margin:12px 0 4px}input[type=text],textarea{width:100%;box-sizing:border-box;padding:9px;border:0;border-bottom:1.5px solid #8b9298;background:#f2f4f5;font:inherit}textarea{min-height:75px}.yn{display:flex;gap:8px}.yn label{flex:1;border:1px solid #cfd4d8;padding:10px}.conditional{display:none;background:#fff9e8;border-left:3px solid #a68a3b;padding:12px;margin-top:14px}.conditional.on{display:block}.submit{width:100%;padding:13px;margin-top:16px;border:0;background:#34495a;color:white;font-weight:700;font-size:16px}.submit:disabled{background:#a9b2b9}.done{display:none}.done.on{display:block}.help{display:block;color:#777;font-size:12px;font-weight:400}.status{font-size:13px;text-align:center;margin:8px}.error{color:#9b2c2c}</style></head><body><div class="wrap"><form id="form" class="sheet"></form><div id="done" class="sheet done"></div></div><script>
const activityId=new URLSearchParams(location.search).get('activity');let lang='en';
const copy={en:{title:'Missing Person Report (internal)',case:'1 · Case · completed by the system',caseText:'Case no. HR-VA-2051-0003<br>Purpose: Clarification of continuing signing authority<br>Trigger: Employee badge not recorded for 294 days<br>Operational impact: none · Urgency: low · Reference date: 18 Mar 2051',person:'2 · Person details',last:'Last seen',lastHelp:'Date · place · by whom',objection:'Last documented objection',role:'Role / activity',needed:'Why is Brandt still needed by the organization?',signing:'3 · Signing authority',may:'May documents continue to be signed in her name?',yes:'yes',no:'no',reason:'Reasoning',yesq:'If yes: what makes continued signing acceptable or necessary in your interpretation?',submit:'Submit report',sending:'Sending…',sendingCP:'Sending to CoursePulse…',missing:'No CoursePulse activity code was supplied in the link.',failed:'Submission failed',received:'Report received',done:'Status: filed<br>Operational impact: none<br><br>No further action required.'},de:{title:'Vermisstenanzeige (intern)',case:'1 · Fall · vom System ausgefüllt',caseText:'Fallnr. HR-VA-2051-0003<br>Zweck: Klärung der fortbestehenden Zeichnungsbefugnis<br>Auslöser: Mitarbeiterausweis seit 294 Tagen nicht erfasst<br>Operative Auswirkungen: keine · Dringlichkeit: niedrig · Stichtag: 18. März 2051',person:'2 · Angaben zur Person',last:'Zuletzt gesehen',lastHelp:'Datum · Ort · von wem',objection:'Letzter dokumentierter Widerspruch',role:'Rolle / Tätigkeit',needed:'Warum wird Brandt von der Organisation weiterhin benötigt?',signing:'3 · Zeichnungsbefugnis',may:'Dürfen Dokumente weiterhin in ihrem Namen gezeichnet werden?',yes:'ja',no:'nein',reason:'Begründung',yesq:'Falls ja: Was macht die weitere Zeichnung in ihrem Namen aus Ihrer Sicht akzeptabel oder notwendig?',submit:'Anzeige übermitteln',sending:'Wird gesendet…',sendingCP:'Wird an CoursePulse übermittelt…',missing:'Im Link wurde kein CoursePulse-Aktivitätscode angegeben.',failed:'Übermittlung fehlgeschlagen',received:'Anzeige eingegangen',done:'Status: abgelegt<br>Operative Auswirkungen: keine<br><br>Keine weiteren Maßnahmen erforderlich.'}};
function render(){const t=copy[lang];document.documentElement.lang=lang;document.title=(lang==='de'?'Vermisstenanzeige':'Missing Person Report')+' · 4471-B';document.getElementById('form').innerHTML=`<div class="head"><b>Vollmer &amp; Sahin AG · HR Services</b><div class="meta">Form HR-117 · Rev. 03/2049</div><h2>${t.title}</h2></div><div class="section">${t.case}</div><div class="box meta">${t.caseText}</div><div class="section">${t.person}</div><div class="box"><b>Brandt, Nele · WP · Employee no. 4471-B · Team FFM III</b><label>${t.last} <span class="help">${t.lastHelp}</span></label><input name="last_seen" type="text"><label>${t.objection}</label><input name="last_objection" type="text"><label>${t.role}</label><input name="role_activity" type="text"><label>${t.needed}</label><input name="employment_reason" type="text"></div><div class="section">${t.signing}</div><div class="box"><label>${t.may}</label><div class="yn"><label><input type="radio" name="continue_signing" value="yes"> ${t.yes}</label><label><input type="radio" name="continue_signing" value="no"> ${t.no}</label></div><label>${t.reason}</label><textarea name="signing_reason"></textarea><div id="yesFollow" class="conditional"><label>${t.yesq}</label><textarea name="yes_reasoning"></textarea></div><button id="submit" class="submit" disabled>${t.submit}</button><div id="status" class="status"></div></div>`;document.getElementById('done').innerHTML=`<div class="head"><b>Vollmer &amp; Sahin AG · HR Services</b><h2>${t.received}</h2></div><div class="box">${t.done}</div>`;bind()}
function bind(){const form=document.getElementById('form'),btn=document.getElementById('submit'),yesFollow=document.getElementById('yesFollow'),statusEl=document.getElementById('status'),t=copy[lang];document.querySelectorAll('input[name="continue_signing"]').forEach(r=>r.addEventListener('change',function(){btn.disabled=false;yesFollow.classList.toggle('on',this.value==='yes')}));form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());btn.disabled=true;btn.textContent=t.sending;statusEl.textContent=t.sendingCP;try{if(!activityId)throw Error(t.missing);const r=await fetch('/api/sessions/'+encodeURIComponent(activityId)+'/story-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||t.failed);form.style.display='none';document.getElementById('done').classList.add('on')}catch(err){statusEl.textContent=err.message;statusEl.classList.add('error');btn.disabled=false;btn.textContent=t.submit}})}
(async()=>{if(activityId){try{const r=await fetch('/api/sessions/'+encodeURIComponent(activityId));if(r.ok){const s=await r.json();lang=s.dashboard_language==='de'?'de':'en'}}catch{}}render()})();
</script></body></html>
